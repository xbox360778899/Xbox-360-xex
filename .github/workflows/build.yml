name: Xbox 360 XEX Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 \
            cmake ninja-build git

      - name: Checkout XSDK
        uses: actions/checkout@v4
        with:
          repository: xenosworks/xsdk
          path: xsdk

      - name: Build Xbox 360 toolchain
        working-directory: xsdk
        run: |
          PREFIX=$HOME/xsdk-gcc \
          WORK=$HOME/xsdk-gcc-work \
          JOBS=2 \
          tools/toolchain/build.sh

      - name: Build XSDK test application
        working-directory: xsdk
        run: |
          export PATH="$HOME/xsdk-gcc/bin:$PATH"
          make -j2

      - name: Upload Xbox 360 XEX
        uses: actions/upload-artifact@v4
        with:
          name: Xbox-360-XEX
          path: xsdk/build/xsdk_test.xex
          if-no-files-found: error
