name: Xbox 360 XEX Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bison flex texinfo \
            libgmp-dev libmpfr-dev libmpc-dev \
            curl xz-utils patch python3 \
            cmake ninja-build git

      - name: Checkout XSDK
        uses: actions/checkout@v4
        with:
          repository: xenosworks/xsdk
          path: xsdk

     - name: Build Xbox 360 toolchain
        working-directory: xsdk
        run: |
          PREFIX=$HOME/xsdk-gcc \
          WORK=$HOME/xsdk-gcc-work \
          JOBS=2 \
          bash tools/toolchain/build.sh
