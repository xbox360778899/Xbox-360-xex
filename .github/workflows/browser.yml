name: browser
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex texinfo libgmp-dev libmpfr-dev libmpc-dev curl xz-utils patch python3 cmake ninja-build git
      - name: Clone xsdk
        run: git clone --depth 1 https://github.com/xenosworks/xsdk.git /home/runner/xsdk
      - uses: actions/cache@v4
        id: tc
        with:
          path: /home/runner/xsdk-gcc
          key: xsdk-gcc-v1
      - name: Build toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          cd /home/runner/xsdk
          PREFIX=/home/runner/xsdk-gcc WORK=/home/runner/xsdk-gcc-work JOBS=$(nproc) bash tools/toolchain/build.sh
      - uses: actions/cache@v4
        id: gl
        with:
          path: /home/runner/glslang-bin
          key: glslang-xenon-v1
      - name: Build glslang
        if: steps.gl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch xenon https://github.com/xenosworks/glslang-xenon.git /home/runner/glslang-xenon
          cd /home/runner/glslang-xenon
          python3 update_glslang_sources.py
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DENABLE_OPT=ON -DSPIRV_SKIP_EXECUTABLES=ON -DGLSLANG_TESTS=OFF
          cmake --build build
          mkdir -p /home/runner/glslang-bin
          cp build/StandAlone/glslang /home/runner/glslang-bin/glslang
      - name: Install glslang
        run: cp /home/runner/glslang-bin/glslang /home/runner/xsdk-gcc/bin/glslang
      - name: Build xsdk
        run: |
          cd /home/runner/xsdk
          make -j$(nproc)
      - name: Build browser
        run: |
          cp "$GITHUB_WORKSPACE/browser/main.c" /home/runner/xsdk/samples/triangle/main.c
          cd /home/runner/xsdk
          make samples
      - uses: actions/upload-artifact@v4
        with:
          name: browser-xex
          path: /home/runner/xsdk/build/samples/triangle/*.xex
